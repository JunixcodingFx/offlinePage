
<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline – kurz nicht erreichbar</title>

  <style>
    :root {
      --bg-start: #0f2027;
      --bg-mid: #203a43;
      --bg-end: #2c5364;
      --accent: #4fd1ff;
      --text-main: #ffffff;
      --text-soft: #d6e2e8;
    }

    * {
      box-sizing: border-box;
      font-family: system-ui, -apple-system, BlinkMacSystemFont,
                   "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, var(--bg-start), var(--bg-mid), var(--bg-end));
      color: var(--text-main);
      overflow: hidden;
    }

    body::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 20% 25%, rgba(79,209,255,0.18), transparent 45%),
        radial-gradient(circle at 80% 75%, rgba(79,209,255,0.12), transparent 45%);
      animation: floatBackground 14s ease-in-out infinite alternate;
    }

    @keyframes floatBackground {
      from { transform: translateY(0); }
      to   { transform: translateY(-28px); }
    }

    .wrapper {
      position: relative;
      z-index: 1;
      max-width: 560px;
      padding: 3.8rem 3.6rem;
      border-radius: 28px;
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(16px);
      box-shadow: 0 30px 80px rgba(0,0,0,0.45);
      text-align: center;
      animation: fadeInUp 1.2s ease-out;
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .icon {
      width: 78px;
      height: 78px;
      margin: 0 auto 1.9rem;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), #9ce8ff);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      font-weight: 700;
      color: #003344;
      box-shadow: 0 14px 32px rgba(79,209,255,0.5);
    }

    h1 {
      margin: 0 0 1rem;
      font-size: 2.3rem;
    }

    p {
      margin: 0 0 2.4rem;
      font-size: 1.05rem;
      line-height: 1.7;
      color: var(--text-soft);
    }

    .actions {
      display: flex;
      justify-content: center;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .button {
      padding: 0.9rem 1.8rem;
      font-size: 0.95rem;
      font-weight: 600;
      border-radius: 16px;
      border: none;
      cursor: pointer;
      transition: transform .2s ease, box-shadow .2s ease;
    }

    .button.primary {
      background: linear-gradient(135deg, var(--accent), #8fe3ff);
      color: #003344;
      box-shadow: 0 12px 26px rgba(79,209,255,0.45);
    }

    .button.primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 18px 40px rgba(79,209,255,0.6);
    }

    footer {
      margin-top: 2.8rem;
      font-size: 0.82rem;
      color: rgba(255,255,255,0.55);
    }
  </style>
</head>
<body>
  <main class="wrapper">
    <div class="icon">⛭</div>

    <h1>Wir sind kurz offline</h1>
    <p>
      Keine Sorge – das liegt nicht an dir.
      <br />
      Wir arbeiten gerade im Hintergrund, damit alles bald wieder
      genauso zuverlässig läuft wie gewohnt.
    </p>


    <div class="actions">
      <button class="button primary" onclick="location.reload()">Seite neu laden</button>
    </div>
    <footer>
      Hier kommt ihr name rein
    </footer>
  </main>
</body>
